<!DOCTYPE html>

<html>
    <head>
       <style>
        body{
            margin: 0;
        }
        .splash{

            position: relative;
            padding: 20px 40px 20px 20px;            
            display: flex;
            background-color: #1d1d2e;
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;

            div{
                display: flex;
                justify-content: center;
                align-items: center;
            }
        }
        .img{
            width: 80%;
            height: 80%;
        }
        .Robogymlogo{
            display: flex;
            flex-direction: column;
            align-items: start !important   ;

            p{
                color: white;
            }
        }
        .CairoLogo{
            display: flex;
            text-align: center;
            flex-direction: column;
            color: white;
            img{
                width: 100%;
            }
            h2,h4{
                margin: 0;
            }
        }
        .line{
            position: absolute;
            height: 80%;
            top: 10%;
            width: 1px;
            opacity: 0.5;
            background-color: whitesmoke;
            left: 55%
        }
       </style>
    </head>

    <body>
        <div class="splash">
            <div class="Robogymlogo">
               <img class="img" src="../RoboGymlogo-text.png"> 
            </div>
            <div class="CairoLogo">
               <img class="img" src="./Cairo_University_Logo.png"> 
            </div>
            <div class="line"></div>
        </div>
    </body>
</html>
